# =============================================================
# PostgreSQL 16 - SQL 튜닝 실습용 설정
# 값을 바꾼 뒤 docker compose restart postgres 로 반영
# =============================================================
listen_addresses = '*'
max_connections = 200

# ---- 메모리 (튜닝 실습의 핵심 파라미터) ----
shared_buffers = 1GB              # 실습: 128MB ~ 4GB로 바꿔가며 buffer hit ratio 관찰
work_mem = 64MB                   # 실습: 정렬/해시 조인 spill(external merge) 관찰용
maintenance_work_mem = 256MB
effective_cache_size = 3GB

# ---- WAL / 체크포인트 (pgbench 실습 핵심) ----
wal_level = replica
max_wal_size = 4GB                # 실습: 작게(256MB) 줄이면 checkpoint 폭풍 관찰 가능
min_wal_size = 512MB
checkpoint_completion_target = 0.9
synchronous_commit = on           # 실습: off로 바꾸면 WAL flush 대기 제거 → TPS 비교

# ---- 병렬 쿼리 (TPC-H/DS 실습 핵심) ----
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4   # 실습: 0으로 끄면 Parallel Seq Scan 비활성화
min_parallel_table_scan_size = 8MB

# ---- 플래너 비용 (실행계획 변화 관찰) ----
random_page_cost = 1.1            # SSD 기준. 4.0(HDD 기본값)으로 올리면 인덱스 선호도 변화
effective_io_concurrency = 200
default_statistics_target = 100   # 실습: 1000으로 올려 히스토그램 정밀도 향상 비교

# ---- 통계/모니터링 ----
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on

# ---- 로깅 (느린 쿼리 관찰) ----
log_min_duration_statement = 1000   # 1초 이상 쿼리 로그
log_checkpoints = on
log_temp_files = 0                  # temp file 생성(=work_mem 부족) 전부 로그
