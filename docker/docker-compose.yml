version: "3.8"

# SQL Tuning Lab - 벤치마크용 DB 3종
#   PostgreSQL : TPC-H / TPC-DS / pgbench (OLAP + OLTP)
#   MySQL      : TPC-H / TPC-DS / sysbench (OLAP + OLTP)
#   ClickHouse : GitHub Archive (Columnar OLAP)
#
# 시작:  docker compose up -d
# 중지:  docker compose down        (데이터 유지)
#        docker compose down -v     (데이터까지 삭제)

services:
  postgres:
    image: postgres:16
    container_name: tuninglab-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tuner
      POSTGRES_PASSWORD: tuner
      POSTGRES_DB: tuninglab
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # 병렬 해시가 쓰는 동적 공유메모리(DSA)는 **컨테이너 안의 /dev/shm** 에서 나온다.
    # 호스트에 여유가 아무리 많아도 컨테이너 몫은 이 값이 상한이다.
    # DSA 는 세그먼트를 1MB 부터 **배로 키우며** 잡고 이전 것을 그대로 두므로,
    # 256MB 세그먼트 하나를 얻으려면 누적 511MB 가 이미 잡혀 있어야 한다.
    # 조인 하나당 Parallel Hash 노드가 붙으므로 곱으로 늘어난다.
    #   SF=0.5(lineitem 300만) : 1g 로 충분
    #   SF=10 (lineitem 6,000만): 1g 로 **부족하다** — 실제로 아래 에러가 났다
    #     ERROR: could not resize shared memory segment ... to 268435456 bytes:
    #            No space left on device
    # 증상이 "디스크 부족"처럼 보이지만 디스크와 무관하다. 규모를 키우면 같이 키운다.
    shm_size: 8g

  mysql:
    image: mysql:8.4
    container_name: tuninglab-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: tuner
      MYSQL_PASSWORD: tuner
      MYSQL_DATABASE: tuninglab
    command:
      - "--local-infile=1"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/tuning.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: tuninglab-clickhouse
    ports:
      - "8123:8123"   # HTTP (JDBC 기본)
      - "9000:9000"   # Native TCP
    environment:
      CLICKHOUSE_USER: tuner
      CLICKHOUSE_PASSWORD: tuner
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  pgdata:
  mysqldata:
  chdata:
