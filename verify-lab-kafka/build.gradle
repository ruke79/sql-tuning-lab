// Kafka 검증 랩 (problem-solving 의 verify-labs-kafka 이식) — 8케이스.
// verify-lab 의 MSA 명제들을 흉내가 아니라 **실물 브로커**로 검증한다.
//
// 실행:
//   ./gradlew :verify-lab-kafka:test                        # 브로커가 없으면 전부 '건너뜀'
//   ./gradlew :verify-lab-kafka:test -Dverify.only=KAFKA-05
//
// 브로커: docker compose -f docker/verify/compose.yaml up -d kafka
//   또는 로컬 KRaft 단일 노드 (scripts/verify/kafka-local.sh 참고).
//   다른 주소는 KAFKA_BOOTSTRAP_SERVERS 로 지정한다.
plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':verify-core')

    // Spring Kafka 대신 클라이언트만 쓴다 — 브로커가 없을 때 컨텍스트가 뜨지 못하는 일을 피하고,
    // 각 케이스가 프로듀서/컨슈머 설정을 직접 들고 있어야 검증 대상이 분명해진다. (원본 주석 유지)
    implementation 'org.apache.kafka:kafka-clients'

    // KAFKA-07: 스키마 호환성 판정을 Avro 의 공식 검사기로 한다 (Schema Registry 서버 없이)
    implementation 'org.apache.avro:avro:1.11.4'

    // 결과를 verify_result 테이블에 적재해 Grafana 가 읽는다 (verify-lab 과 같은 테이블).
    // 이 모듈은 Spring DataSource 를 쓰지 않으므로(위 이유) 드라이버만 얹고 DriverManager 로 붙는다.
    runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
    String only = System.getProperty('verify.only')
    if (only) {
        systemProperty 'verify.only', only
        outputs.upToDateWhen { false }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = (only as boolean)
    }
}
